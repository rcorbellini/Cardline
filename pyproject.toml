[project]
name = "cardline"
version = "0.1.0"
description = "Pipeline de abertura de boosters: identifica cartas no vídeo, precifica, cataloga e gera overlay."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
cardline = "cardline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardline"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
