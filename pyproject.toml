[project]
name = "cardline"
version = "0.1.0"
description = "Pipeline de abertura de boosters: identifica cartas no vídeo, precifica, cataloga e gera overlay."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# narração do vídeo com voz em português (XTTS-v2 + Whisper para conferir cada fala); pesado: torch e ~2 GB de modelo
narracao = [
    "coqui-tts>=0.27.5",
    "faster-whisper>=1.2.1",
    "num2words>=0.5.14",
    "torch>=2.9",
    "torchaudio>=2.9",
    "torchcodec>=0.8",
    "transformers>=4.57,<5",  # o XTTS do coqui-tts ainda usa APIs que saíram na versão 5
]

[project.scripts]
cardline = "cardline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardline"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# torch só de CPU: bem menor que o pacote com CUDA, e a narração roda bem na CPU
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
torchcodec = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
