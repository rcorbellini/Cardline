# Preferências do cardline. Todas são opcionais; os valores abaixo são os padrões.

# Moeda do overlay e da página: "USD" (preço de mercado do TCGplayer) ou "BRL" (convertido pela cotação do dia).
currency = "USD"

# Cartas por booster de Lorcana (= 12): agrupa os boosters, os totais e a inferência de qual carta é a foil.
# Magic (14, o Play Booster) e Pokémon (10) usam o tamanho do jogo.
pack_size = 12

# Frames por segundo analisados no scan (mais = instante de cada carta mais preciso, scan mais lento).
analysis_fps = 10.0

# Lado menor do vídeo com overlay: 1080 → 1080x1920 em retrato; 2160 → 4K.
output_short_side = 1080

# Segundos do resumo no fim do vídeo com overlay.
outro_seconds = 4.0

# Segundos da capa no começo do vídeo com overlay: o primeiro frame parado, com o booster e o valor pago
# entrando animados; na saída, o booster voa para o painel do topo. 0 = sem capa.
intro_seconds = 3.0

# Logo no vídeo com overlay (o padrão fica em data/logos/padrao.png; dá para trocar na criação da pipeline):
# canto (top-right, top-left, bottom-right ou bottom-left) e opacidade, de 0 a 1.
logo_corner = "top-right"
logo_opacity = 0.6

# Efeitos de fundo do vídeo, com volume relativo à voz do narrador (1 = tão alto quanto ela; 0,25 ≈ 12 dB abaixo;
# 0 = sem o efeito). O "ka-ching" de caixa registradora toca quando a etiqueta de cada carta aparece; os aplausos,
# quando a soma das cartas alcança o valor pago pelo booster.
card_sound_volume = 0.25
celebration_volume = 0.3

# Modelo de visão do Ollama que confere cada carta lendo nome e número de coleção (ex.: "qwen3.5:4b").
# Preenchido, a conferência já vem marcada no upload.
# Só sinaliza divergências, nunca troca a carta sozinho. Vazio = desmarcada (marcando, usa qwen3.5:4b).
verify_model = ""

# Processos paralelos no scan (padrão: núcleos - 1, no máximo 8).
# workers = 8

# Narração do vídeo (precisa do extra: uv sync --extra narracao).
# Voz do XTTS-v2 que lê o roteiro; `uv run cardline voz` lista as 58 opções.
narration_voice = "Damien Black"

# Modelo do Ollama que escreve as piadas das cartas no roteiro (o resto do roteiro tem estrutura fixa).
# Vazio = roteiro padrão, sem piadas por carta.
narration_writer = "gemma3:4b"

# Endereço público do cardline, de onde o Instagram baixa o vídeo ao publicar um Reel pela API
# (ex.: "https://meu-tunel.ngrok-free.app"). Vazio = o endereço do túnel pelo qual a página foi aberta,
# ou o que o ngrok informa na API local dele (http://127.0.0.1:4040).
public_url = ""

# Tags dos vídeos postados no YouTube pela API; o nome do set de cada abertura entra junto.
# Na página dá para editar antes de postar.
youtube_tags = ["lorcana", "disney lorcana", "booster", "abertura de booster", "tcg", "br", "brasil"]

# Contas (entrar com o Google). admin_email é o administrador: fica com os dados de antes das contas e cuida dos
# sets e do cliente OAuth (vazio = o primeiro a entrar). Também podem entrar os e-mails de allowed_emails ("*" =
# qualquer conta do Google) e quem recebeu um compartilhamento. Para não publicar e-mails no git, coloque estas
# chaves em data/config.toml (fora do git), que vale por cima deste arquivo.
# admin_email = "voce@gmail.com"
# allowed_emails = ["amigo@gmail.com"]
